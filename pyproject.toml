[project]
name = "starlive-measure"
version = "0.1.0"
description = "Trace, measurement, and live-stream diagnostics for StarLive experiments"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "matplotlib>=3.9.4",
    "numpy>=2.0.2",
    "pandas>=2.3.3",
    "scipy>=1.13.1",
]

[project.scripts]
starlive-trace = "starlive_measure.trace.trace_runner:main"
starlive-measurement = "starlive_measure.trace.trace_runner:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
